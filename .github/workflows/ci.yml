name: CI
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Node (no caching or pnpm assumptions)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Read PNPM version from package.json's "packageManager" field
      - name: Determine pnpm version
        id: pm
        run: |
          echo "PNPM_VERSION=$(node -e "console.log(require('./package.json').packageManager.split('@')[1].split('+')[0])")" >> $GITHUB_ENV
          echo "Using pnpm@$PNPM_VERSION"

      # Install that exact pnpm version globally
      - name: Install pnpm
        run: npm i -g pnpm@${PNPM_VERSION}

      - run: pnpm --version

      # Install deps and build
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -w build