name: CI
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Node (Corepack included)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Enable Corepack so it installs PNPM from package.json's "packageManager"
      - run: corepack enable

      # (Optional) show pnpm version to debug
      - run: pnpm --version

      # Install deps and build
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -w build

